<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Login System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span> Secure Login</a>
      <span class="tag">SECURE SDLC DEMO</span>
    </header>
    <section class="panel">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="notice {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </section>
    <footer>Python · Flask · SQLite <span>Educational security project</span></footer>
  </main>
</body>
</html>
